[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D DRONE_FW_VERSION=\"0.1.0\"
  -D DRONE_AP_SSID=\"DroneAQ-ESP32\"
  -D DRONE_AP_PASSWORD=\"airquality\"
  -D DRONE_ENABLE_GPS=1
  -D DRONE_ENABLE_TVOC=0
  -D DRONE_ENABLE_DC01=0
  -D DRONE_SIMULATE_DISABLED_SENSORS=1
